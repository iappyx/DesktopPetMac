# Builds DesktopPet.app on GitHub's macOS runners.
# - Push a tag like v1.5.0: builds that version and publishes it as a GitHub Release with a zip.
# - Run it by hand (Actions tab -> Release -> Run workflow): builds a test zip, downloadable from the run page.
# The app is ad-hoc signed (no Apple developer account), so users confirm it once via "Open Anyway".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-test" >> "$GITHUB_ENV"
          fi

      - name: Install Pillow (used by make-icon.py)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build DesktopPet.app
        run: ./build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent DesktopPet.app "DesktopPet-$VERSION.zip"

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-${{ env.VERSION }}
          path: DesktopPet-${{ env.VERSION }}.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Desktop Pet for macOS $VERSION, for Apple Silicon and Intel Macs, macOS 12 or newer.

          **Install:** download \`DesktopPet-$VERSION.zip\`, unzip it and move **DesktopPet.app** to Applications.

          **First launch:** the app is not notarized by Apple, so macOS blocks it the first time
          ("Apple could not verify…"). Open it once, then go to **System Settings → Privacy & Security**
          and click **Open Anyway**. After that it opens normally.

          The app lives in the menu bar. Pets are downloaded from the original
          [desktopPet](https://github.com/Adrianotiger/desktopPet) project the first time you pick them.
          EOF
          gh release create "$GITHUB_REF_NAME" "DesktopPet-$VERSION.zip" \
            --title "Desktop Pet for macOS $VERSION" --notes-file notes.md
